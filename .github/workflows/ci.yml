name: ci

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: infrabot-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finalize-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/secure-cli-pairing
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Bind API events to the configured Telegram bot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main.rs")
          text = path.read_text()

          if "output: String" not in text:
              text, count = re.subn(
                  r"(struct EventRequest\s*\{\s*\n)(\s*)(kind:\s*String,)",
                  r"\1\2output: String,\n\2\3",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("EventRequest declaration not found")

          if 'request.output.trim_start_matches' not in text:
              marker = re.search(r"\n(\s*)if !valid_event\(&request\) \{", text)
              if marker is None:
                  raise SystemExit("event validation marker not found")
              indent = marker.group(1)
              guard = (
                  f"\n{indent}if request.output.trim_start_matches('@') "
                  "!= state.config.telegram_bot_username {\n"
                  f"{indent}    return api_error(StatusCode::BAD_REQUEST, \"unknown_output\");\n"
                  f"{indent}}}\n"
              )
              text = text[: marker.start()] + guard + text[marker.start():]

          if "valid_token(&event.output, 64)" not in text:
              text, count = re.subn(
                  r"(fn valid_event\(event: &EventRequest\) -> bool \{\s*\n)(\s*)(valid_token\(&event.kind, 128\))",
                  r"\1\2valid_token(&event.output, 64)\n\2    && \3",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("valid_event function not found")

          if 'output: "infra_services_bot".into()' not in text:
              text, count = re.subn(
                  r"(let event = EventRequest\s*\{\s*\n)(\s*)(kind: \"service\.failed\"\.into\(\),)",
                  r'\1\2output: "infra_services_bot".into(),\n\2\3',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("EventRequest test fixture not found")

          path.write_text(text)

          agent_config = Path("deploy/vps/infra-agent.infra")
          doc = agent_config.read_text()
          marker = '    output "infra_services_bot" {'
          comment = '    # output name is the Telegram bot username\n'
          if comment not in doc:
              if marker not in doc:
                  raise SystemExit("Telegram output block not found")
              doc = doc.replace(marker, comment + marker, 1)
          agent_config.write_text(doc)

          for filename in ["README.md", "deploy/vps/README.md"]:
              readme = Path(filename)
              doc = readme.read_text()
              doc = doc.replace(
                  "generic input/output adapter contract",
                  "Docker input and Telegram bot output contract",
              )
              doc = doc.replace(
                  "input/output adapter contract",
                  "Docker input and Telegram bot output contract",
              )
              doc = doc.replace(
                  "output adapter ID",
                  "Telegram bot output name",
              )
              readme.write_text(doc)
          PY
      - run: cargo fmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - name: Commit output identity
        run: |
          set -Eeuo pipefail
          if [[ -z "$(git status --porcelain -- src/main.rs README.md deploy/vps)" ]]; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.rs README.md deploy/vps
          git commit -m "Bind events to Telegram output identity"
          git push origin HEAD:agent/secure-cli-pairing

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  deployment:
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout companion infraCLI agent
        uses: actions/checkout@v4
        with:
          repository: 0x0sky/infraCLI
          ref: agent/containerized-service-monitor
          path: deploy/vps/infraCLI-src
      - name: Validate shell contracts
        run: |
          bash -n deploy/vps/deploy.sh deploy/vps/verify.sh
          shellcheck deploy/vps/deploy.sh deploy/vps/verify.sh
      - name: Validate Compose contract
        run: |
          cp deploy/vps/env.example deploy/vps/.env
          docker compose \
            --file deploy/vps/compose.yaml \
            --env-file deploy/vps/.env \
            config --quiet
      - name: Build runtime images
        run: |
          docker compose \
            --file deploy/vps/compose.yaml \
            --env-file deploy/vps/.env \
            build infrabot infra-agent
