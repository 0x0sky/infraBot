name: ci

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: infrabot-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/secure-cli-pairing
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Add projected event fields
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main.rs")
          text = path.read_text()

          old = 'use std::{collections::HashSet, sync::Arc, time::Duration};'
          new = 'use std::{collections::{BTreeMap, HashSet}, sync::Arc, time::Duration};'
          if old not in text:
              raise SystemExit("std collections import not found")
          text = text.replace(old, new, 1)

          pattern = re.compile(r'''#\[derive\(Deserialize\)\]\nstruct EventRequest \{.*?\n\}''', re.S)
          replacement = '''#[derive(Deserialize)]
          struct EventRequest {
              kind: String,
              project: String,
              service: Option<String>,
              status: Option<String>,
              message: String,
              #[serde(default)]
              fields: BTreeMap<String, String>,
          }'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("EventRequest not found")

          pattern = re.compile(r'''fn valid_event\(event: &EventRequest\) -> bool \{.*?\n\}\n\nfn valid_token''', re.S)
          replacement = '''fn valid_event(event: &EventRequest) -> bool {
              valid_token(&event.kind, 128)
                  && valid_text(&event.project, 128)
                  && event
                      .service
                      .as_deref()
                      .is_none_or(|value| valid_text(value, 128))
                  && event
                      .status
                      .as_deref()
                      .is_none_or(|value| valid_text(value, 64))
                  && valid_text(&event.message, 4_000)
                  && event.fields.len() <= 24
                  && event
                      .fields
                      .iter()
                      .all(|(name, value)| valid_token(name, 64) && valid_text(value, 512))
                  && event.fields.values().map(String::len).sum::<usize>() <= 4_096
          }

          fn valid_token'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("valid_event not found")

          pattern = re.compile(r'''fn render_event\(source: &str, event: &EventRequest\) -> String \{.*?\n\}\n\nfn secure_eq''', re.S)
          replacement = '''fn render_event(source: &str, event: &EventRequest) -> String {
              let mut lines = vec![
                  format!("{} · {}", event.kind, event.project),
                  format!("source: {source}"),
              ];
              if event.fields.is_empty() {
                  if let Some(service) = event.service.as_deref() {
                      lines.push(format!("service: {service}"));
                  }
                  if let Some(status) = event.status.as_deref() {
                      lines.push(format!("status: {status}"));
                  }
              } else {
                  for (name, value) in &event.fields {
                      lines.push(format!("{name}: {value}"));
                  }
              }
              lines.push(String::new());
              lines.push(event.message.trim().to_owned());
              lines.join("\\n")
          }

          fn secure_eq'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("render_event not found")

          marker = '''            message: "health check failed".into(),
                  };'''
          replacement = '''            message: "health check failed".into(),
                  fields: BTreeMap::from([
                      ("image".into(), "market:latest".into()),
                      ("previous_status".into(), "healthy".into()),
                  ]),
              };'''
          if marker not in text:
              raise SystemExit("event fixture not found")
          text = text.replace(marker, replacement, 1)

          marker = '        assert!(rendered.contains("source: primary"));'
          replacement = '''        assert!(rendered.contains("source: primary"));
              assert!(rendered.contains("image: market:latest"));'''
          if marker not in text:
              raise SystemExit("render assertion not found")
          text = text.replace(marker, replacement, 1)

          path.write_text(text)
          PY
      - run: cargo fmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - name: Commit projected event contract
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- src/main.rs; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.rs
          git commit -m "Render projected event fields"
          git push origin HEAD:agent/secure-cli-pairing

  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout companion infraCLI agent
        uses: actions/checkout@v4
        with:
          repository: 0x0sky/infraCLI
          ref: agent/containerized-service-monitor
          path: deploy/vps/infraCLI-src
      - name: Validate shell contracts
        run: |
          bash -n deploy/vps/deploy.sh deploy/vps/verify.sh
          shellcheck deploy/vps/deploy.sh deploy/vps/verify.sh
      - name: Validate Compose contract
        run: |
          cp deploy/vps/env.example deploy/vps/.env
          docker compose \
            --file deploy/vps/compose.yaml \
            --env-file deploy/vps/.env \
            config --quiet
      - name: Build runtime images
        run: |
          docker compose \
            --file deploy/vps/compose.yaml \
            --env-file deploy/vps/.env \
            build infrabot infra-agent
