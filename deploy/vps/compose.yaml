name: zero-x-infrabot-${EDGE_TARGET:-vps-spaceship-01}

services:
  infrabot:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "127.0.0.1:8787:8787"
    networks:
      edge:
        aliases:
          - infra-bot
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8787/health
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  docker-api:
    image: ${DOCKER_SOCKET_PROXY_IMAGE:-ghcr.io/tecnativa/docker-socket-proxy:0.4.2}
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      POST: "0"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      monitor:
        aliases:
          - docker-api
    read_only: true
    tmpfs:
      - /run:rw,noexec,nosuid,nodev,size=4m,mode=0755
      - /var/lib/haproxy:rw,noexec,nosuid,nodev,size=4m,mode=0755
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  infra-agent:
    image: zero-x-infra-agent:${EDGE_TARGET:-vps-spaceship-01}
    build:
      context: ./infraCLI-src
      dockerfile: Dockerfile.agent
    restart: unless-stopped
    init: true
    environment:
      INFRA_CREDENTIALS_FILE: /var/lib/infra-credentials/vps-spaceship-01.json
    volumes:
      - ./infra-agent.infra:/etc/infra/.infra:ro
      - ${INFRABOT_CREDENTIALS_DIR:-/opt/infrabot/credentials}:/var/lib/infra-credentials:ro
      - infra-agent-state:/var/lib/infra
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      edge:
      monitor:
    depends_on:
      infrabot:
        condition: service_healthy
      docker-api:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:9090/health
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  infra-auth:
    image: zero-x-infra-agent:${EDGE_TARGET:-vps-spaceship-01}
    profiles:
      - tools
    environment:
      INFRA_CREDENTIALS_FILE: /var/lib/infra-credentials/vps-spaceship-01.json
    volumes:
      - ${INFRABOT_CREDENTIALS_DIR:-/opt/infrabot/credentials}:/var/lib/infra-credentials
    networks:
      edge:
    entrypoint:
      - /usr/local/bin/infra
    command:
      - --help

networks:
  edge:
    name: ${MARKET_EDGE_NETWORK:-nilx-edge}
    external: true
  monitor:
    internal: true

volumes:
  infra-agent-state:
