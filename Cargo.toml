[package]
name = "infrabot"
version = "0.1.0"
edition = "2024"
description = "secure Telegram authorization and notification gateway for infraCLI"
license = "MIT"
repository = "https://github.com/0x0sky/infraBot"

[dependencies]
anyhow = "1.0"
axum = "0.7"
base64 = "0.22"
jsonwebtoken = "9.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1.40", features = ["macros", "net", "rt-multi-thread", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.10", features = ["serde", "v4"] }
